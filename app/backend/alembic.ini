[alembic]
script_location = rdscommander/control_db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+psycopg://rdscommander:rdscommander@localhost:5432/rdscommander

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
