[project]
name = "rdscommander"
version = "0.4.0"
description = "Console that manages PostgreSQL on AWS RDS and Aurora through reviewed Terraform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "boto3>=1.35",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "moto[s3,rds,ec2]>=5.0.20",
  "testcontainers[postgres]>=4.8",
  "types-pyyaml",
  "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rdscommander"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "D"]
ignore = ["D203", "D213", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"rdscommander/control_db/migrations/*" = ["D", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the simulated AWS container and the OpenTofu binary (RDSC_INTEGRATION=1)",
  "runs_after_every_other_test: moved to the end of the session; reads what the other tests recorded",
]
